apply plugin: 'com.android.application'

// Loading the keystore properties file
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.swiftmind.sesha"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.swiftmind.sesha"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 66
        versionName "1.6.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // A release must never be debug-signed: Play rejects the upload, and the
            // old silent fallback made that failure surface only at the Console.
            signingConfig signingConfigs.release
        }
    }

    // Store native libraries uncompressed and page-aligned. Required for the 16 KB
    // page-size devices that Play mandates support for, and which the ML Kit /
    // CameraX .so files in this app would otherwise fail to load on.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    bundle {
        // Ship every language in the base bundle. Splitting by language would let Play
        // deliver an Arabic-less install to a device whose locale is not set to Arabic.
        language {
            enableSplit = false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "KAI-${variant.name}-${defaultConfig.versionName}.apk"
        }
    }
}

// Validate release signing before any task runs, so a misconfigured machine fails
// here with an actionable message instead of silently producing a debug-signed
// artifact that only gets rejected once it reaches the Play Console.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.name ==~ /(?i).*(assemble|bundle)Release.*/ }
    if (!buildingRelease) {
        return
    }

    if (!keystorePropertiesFile.exists()) {
        throw new GradleException(
            "Release signing is not configured: android/keystore.properties is missing.\n" +
            "It is gitignored on purpose — the previous keystore was committed to a public\n" +
            "repository and had to be replaced. Recreate it with:\n" +
            "  storePassword=...\n  keyPassword=...\n  keyAlias=kai-upload\n  storeFile=app/kai-upload-key.jks"
        )
    }

    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProperties.containsKey(it) }
    if (missing) {
        throw new GradleException("android/keystore.properties is missing required keys: ${missing.join(', ')}")
    }

    if (!rootProject.file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException("Keystore file not found: ${keystoreProperties['storeFile']}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-common'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found")
}
