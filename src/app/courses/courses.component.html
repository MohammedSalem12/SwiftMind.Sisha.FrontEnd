<app-page-header [title]="'المقررات الدراسية'" [titleEn]="'Courses'" [backTo]="'/'" [count]="totalCount()">
  <button ph-actions class="ph-action" (click)="goToAddCourse()" aria-label="إنشاء مقرر · Add course">
    <i class="fas fa-plus"></i>
  </button>
</app-page-header>

<div appPullToRefresh (appPullToRefresh)="refreshData($event)">
<div class="search-row">
  <input class="search" placeholder="بحث بالاسم أو الكود · Search by name or code" [ngModel]="filter()" (ngModelChange)="filter.set($event)" (keyup.enter)="onSearch()" />
  <button class="btn-primary" (click)="onSearch()">بحث</button>
</div>

<div *ngIf="loading()" class="loading">Loading courses...</div>

<div class="courses-grid">
  <div *ngFor="let c of courses(); trackBy: trackById" class="course-card">
    <div class="card-top">
      <div class="code">{{ c.code || '-' }}</div>
      <div class="grade">{{ c.gradeName }}</div>
    </div>
    <div class="card-body">
      <div class="title">{{ c.nameAr }}</div>
      <div class="title-ar" *ngIf="c.nameEn">{{ c.nameEn }}</div>
    </div>
    <div class="card-actions">
      <button class="btn-outline" (click)="showDetails(c)">Details</button>
    </div>
  </div>
</div>

<div *ngIf="!loading() && courses().length === 0" class="empty-state">
  <p>No courses found.</p>
</div>

<!-- Details modal -->
<div class="modal-backdrop" *ngIf="selected()">
  <div class="modal-card">
    <div class="modal-header">
      <h3>{{ selected()?.nameEn }}</h3>
      <button class="close" (click)="closeDetails()">✕</button>
    </div>
    <div class="modal-body">
      <div><strong>Code:</strong> {{ selected()?.code || '-' }}</div>
      <div><strong>Grade:</strong> {{ selected()?.gradeName }}</div>
      <div><strong>Name (AR):</strong> {{ selected()?.nameAr }}</div>
    </div>
    <div class="modal-actions">
      <button class="btn-outline" (click)="closeDetails()">Close</button>
      <button class="btn-outline" (click)="router.navigate(['/courses', selected()?.id, 'groups'])">Groups</button>
      <button class="btn-primary" (click)="router.navigate(['/courses', selected()?.id, 'edit'])">Edit</button>
    </div>
  </div>
</div>

</div>
