<div class="action-page" dir="rtl">

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">
      <i class="fas fa-arrow-right"></i>
    </button>
    <div class="header-info">
      @if (loading()) {
        <div class="header-skeleton"></div>
      } @else {
        <h1 class="header-title">{{ course()?.nameAr || course()?.nameEn || 'المقرر' }}</h1>
        <div class="header-meta">
          @if (course()?.code) {
            <span class="header-chip">{{ course()!.code }}</span>
          }
          @if (course()?.gradeName) {
            <span class="header-chip">{{ course()!.gradeName }}</span>
          }
        </div>
      }
    </div>
  </div>

  <!-- Actions -->
  <div class="actions-wrap">

    <!-- Attendance -->
    <button class="action-card card-attendance" (click)="goToAttendance()">
      <div class="card-glow"></div>
      <div class="card-inner">
        <div class="card-icon">
          <i class="fas fa-clipboard-check"></i>
        </div>
        <div class="card-text">
          <span class="card-label">تسجيل الغياب</span>
          <span class="card-label-en">Attendance</span>
          <span class="card-hint">تسجيل حضور وغياب الطلاب</span>
        </div>
        <div class="card-cta">
          <span>ابدأ</span>
          <i class="fas fa-arrow-left"></i>
        </div>
      </div>
    </button>

    <!-- Marks -->
    <button class="action-card card-marks" (click)="goToMarks()">
      <div class="card-glow"></div>
      <div class="card-inner">
        <div class="card-icon">
          <i class="fas fa-star"></i>
        </div>
        <div class="card-text">
          <span class="card-label">إدخال الدرجات</span>
          <span class="card-label-en">Marks Entry</span>
          <span class="card-hint">رصد درجات الامتحانات والأعمال</span>
        </div>
        <div class="card-cta">
          <span>ابدأ</span>
          <i class="fas fa-arrow-left"></i>
        </div>
      </div>
    </button>

  </div>

</div>
