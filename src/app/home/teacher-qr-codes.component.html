<div class="qr-page" dir="rtl">

  <!-- Hero Header -->
  <div class="hero-header">
    <button class="back-btn" (click)="goBack()">
      <i class="fas fa-arrow-right"></i>
    </button>
    <div class="hero-text">
      <h1><i class="fas fa-qrcode me-2"></i>رموز QR للمقررات</h1>
      <p>شارك هذه الرموز مع الطلاب للتسجيل السريع</p>
    </div>
    <button class="refresh-btn" (click)="loadQRCodes()" [disabled]="loading()">
      <i class="fas fa-sync-alt" [class.fa-spin]="loading()"></i>
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading()" class="loading-state">
    <div class="spinner"></div>
    <p>جاري إنشاء رموز QR...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error() && !loading()" class="error-state">
    <i class="fas fa-exclamation-circle"></i>
    <p>{{ error() }}</p>
    <button class="btn-retry" (click)="loadQRCodes()">إعادة المحاولة</button>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading() && !error() && courseQRs().length === 0" class="empty-state">
    <i class="fas fa-book-open"></i>
    <p>لا توجد مقررات مسجلة</p>
  </div>

  <!-- QR Cards -->
  <div *ngIf="!loading() && courseQRs().length > 0" class="qr-list">
    <div *ngFor="let item of courseQRs(); trackBy: trackByCourseId" class="qr-card">
      <div class="course-info">
        <div class="course-icon">
          <i class="fas fa-book-open"></i>
        </div>
        <div class="course-details">
          <h3 class="course-name">{{ item.course.nameAr || item.course.nameEn }}</h3>
          <span class="course-code">{{ item.course.code }}</span>
          <span *ngIf="item.course.gradeName" class="course-grade">{{ item.course.gradeName }}</span>
        </div>
      </div>
      <div class="qr-image-wrap">
        <img [src]="item.qrDataUrl" alt="QR Code" class="qr-image" />
      </div>
      <div class="qr-url">
        <i class="fas fa-link me-1"></i>
        <span>{{ item.enrollUrl }}</span>
      </div>
      <p class="qr-hint">امسح الرمز بكاميرا الهاتف للتسجيل في المقرر</p>
    </div>
  </div>

</div>
