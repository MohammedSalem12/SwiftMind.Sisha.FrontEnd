<app-page-header [title]="'المعلمون'" [titleEn]="'Teachers'" [backTo]="'/'" [count]="totalCount()">
  <button ph-actions class="ph-action" (click)="goToAddTeacher()" aria-label="إضافة معلم · Add teacher">
    <i class="fas fa-plus"></i>
  </button>
</app-page-header>

<div appPullToRefresh (appPullToRefresh)="refreshData($event)">
<div class="search-row">
  <input class="search" placeholder="بحث بالاسم · Search by name" [ngModel]="filter()" (ngModelChange)="filter.set($event)" (keyup.enter)="onSearch()" />
  <button class="btn-primary" (click)="onSearch()">بحث</button>
</div>

<div *ngIf="loading()" class="loading">Loading...</div>

<div class="teachers-list">
  <div *ngFor="let t of teachers(); trackBy: trackById" class="teacher-row">
    <div class="left">
      <div class="avatar">{{ (t.firstName?.[0]||'') + (t.lastName?.[0]||'') }}</div>
      <div class="info">
        <div class="name">{{ t.firstName }} {{ t.lastName }}</div>
        <div class="meta small muted">{{ t.address || '-' }}</div>
      </div>
    </div>
    <div class="right">
      <button class="btn-outline me-2" (click)="showDetails(t)">Details</button>
      <button class="btn-outline me-2" (click)="router.navigate(['/teachers', t.id, 'courses'])">Courses</button>
      <button class="btn-primary" (click)="router.navigate(['/teachers', t.id, 'enroll'])">Enroll</button>
    </div>
  </div>
</div>

</div>
