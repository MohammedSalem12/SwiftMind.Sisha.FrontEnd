<app-page-header [title]="'إضافة معلم'" [titleEn]="'Add Teacher'" [backTo]="'/teachers'"></app-page-header>

<div class="page add-teacher-page">
  <div class="card form-card">
    <form class="card-body" (ngSubmit)="submit()">
      <div class="grid">
        <div class="field">
          <label>First name</label>
          <input name="firstName" [ngModel]="model().firstName" (ngModelChange)="setField('firstName', $event)" required />
        </div>

        <div class="field">
          <label>Last name</label>
          <input name="lastName" [ngModel]="model().lastName" (ngModelChange)="setField('lastName', $event)" required />
        </div>

        <div class="field">
          <label>Email <span class="required">*</span></label>
          <input name="email" type="email" [ngModel]="model().email" (ngModelChange)="setField('email', $event)" required placeholder="teacher@example.com" />
        </div>

        <div class="field">
          <label>Phone number</label>
          <input name="phoneNumber" [ngModel]="model().phoneNumber" (ngModelChange)="setField('phoneNumber', $event)" placeholder="+966..." />
        </div>

        <div class="field">
          <label>Password <span class="required">*</span></label>
          <input name="password" type="password" [ngModel]="model().password" (ngModelChange)="setField('password', $event)" required placeholder="Min 6 characters" />
        </div>

        <div class="field">
          <label>Address</label>
          <input name="address" [ngModel]="model().address" (ngModelChange)="setField('address', $event)" />
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" type="submit" [disabled]="saving()">Save Teacher</button>
        <button type="button" class="btn-outline" (click)="cancel()">Cancel</button>
        <div class="error" *ngIf="errorMsg()">{{ errorMsg() }}</div>
      </div>
    </form>
  </div>
</div>
