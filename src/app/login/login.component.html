<div class="auth-container">
  <div class="auth-content">
    <div class="auth-card login-card">
      <!-- Header Section -->
      <div class="auth-header">
        <div class="logo-container">
          <img src="/assets/images/logo/logo.png" alt="SwiftMind Logo" class="logo" />
        </div>
        <h1 class="page-title">تسجيل الدخول</h1>
      </div>

      <!-- Form Section -->
      <div class="auth-form">
        <div *ngIf="error()" class="alert alert-error">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ error() }}</span>
        </div>

        <form (ngSubmit)="submit()" #loginForm="ngForm">
          <div class="input-group">
            <label for="userInput">اسم المستخدم أو البريد الإلكتروني</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input
                id="userInput"
                name="userNameOrEmailAddress"
                type="text"
                placeholder="أدخل اسم المستخدم أو البريد الإلكتروني"
                [(ngModel)]="model().userNameOrEmailAddress"
                required
                class="form-input"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="passwordInput">كلمة المرور</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input
                id="passwordInput"
                name="password"
                type="password"
                placeholder="أدخل كلمة المرور"
                [(ngModel)]="model().password"
                required
                class="form-input"
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-wrapper">
              <input
                type="checkbox"
                [(ngModel)]="model().rememberMe"
                name="rememberMe"
              />
              <span class="checkmark"></span>
              <span class="checkbox-label">تذكر دخولي</span>
            </label>
            <a routerLink="/forgot-password" class="forgot-link">نسيت كلمة المرور؟</a>
          </div>

          <button 
            type="submit" 
            class="btn btn-primary btn-large"
            [disabled]="loading() || !loginForm.valid"
            [class.loading]="loading()"
          >
            <span *ngIf="!loading()">تسجيل الدخول</span>
            <span *ngIf="loading()" class="loading-content">
              <i class="fas fa-spinner fa-spin"></i>
              جارٍ تسجيل الدخول...
            </span>
          </button>
        </form>

        <div class="auth-switch">
          <p>ليس لديك حساب؟ <a routerLink="/register" class="register-link">إنشاء حساب جديد</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
