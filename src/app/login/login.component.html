<div class="login-page" dir="rtl">

  <!-- Hero Section -->
  <div class="hero-section">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="brand">
      <div class="logo-ring">
        <img src="/assets/images/logo/logo.png" alt="SwiftMind" class="logo-img" />
      </div>
      <h1 class="app-name">SwiftMind</h1>
      <p class="app-tagline">نظام إدارة التعليم</p>
      <p class="app-tagline-en">Education Management System</p>
    </div>
  </div>

  <!-- Form Sheet -->
  <div class="form-sheet">
    <div class="sheet-handle"></div>

    <h2 class="sheet-title">تسجيل الدخول <span class="sheet-title-en">Sign In</span></h2>

    <!-- Error Banner -->
    @if (error()) {
      <div class="error-banner">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form (ngSubmit)="submit()" #loginForm="ngForm" class="login-form">

      <!-- Username -->
      <div class="field-wrap">
        <label class="field-label">اسم المستخدم / Username</label>
        <div class="field-inner">
          <i class="fas fa-user field-icon"></i>
          <input
            id="usernameInput"
            name="userNameOrEmailAddress"
            type="text"
            class="field-input"
            placeholder="اسم المستخدم أو البريد الإلكتروني"
            [ngModel]="model().userNameOrEmailAddress"
            (ngModelChange)="updateUsername($event)"
            required
            autocomplete="username"
            dir="ltr"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="field-wrap">
        <label class="field-label">كلمة المرور / Password</label>
        <div class="field-inner">
          <i class="fas fa-lock field-icon"></i>
          <input
            id="passwordInput"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="field-input"
            placeholder="كلمة المرور"
            [ngModel]="model().password"
            (ngModelChange)="updatePassword($event)"
            required
            autocomplete="current-password"
            dir="ltr"
          />
          <button type="button" class="toggle-pw" (click)="togglePassword()" tabindex="-1">
            <i [class]="showPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Options Row -->
      <div class="options-row">
        <label class="remember-label">
          <input
            type="checkbox"
            name="rememberMe"
            [ngModel]="model().rememberMe"
            (ngModelChange)="updateRememberMe($event)"
            class="remember-checkbox"
          />
          <span class="custom-check"></span>
          <span>تذكرني</span>
        </label>
        <a routerLink="/forgot-password" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn-login"
        [disabled]="loading() || biometricLoading() || !loginForm.valid"
      >
        @if (loading()) {
          <i class="fas fa-spinner fa-spin"></i>
          <span>جارٍ تسجيل الدخول...</span>
        } @else {
          <i class="fas fa-sign-in-alt"></i>
          <span>تسجيل الدخول</span>
        }
      </button>

    </form>

    <!-- Biometric Section -->
    @if (biometricAvailable()) {
      <div class="biometric-section">
        <div class="divider-line">
          <span class="divider-text">أو / or</span>
        </div>
        <button
          type="button"
          class="btn-biometric"
          (click)="loginWithBiometric()"
          [disabled]="loading() || biometricLoading()"
        >
          @if (biometricLoading()) {
            <i class="fas fa-spinner fa-spin"></i>
            <span>جارٍ التحقق...</span>
          } @else {
            <i class="fas fa-fingerprint biometric-icon"></i>
            <span>الدخول ببصمة الإصبع</span>
          }
        </button>
      </div>
    }

    <!-- Social Login -->
    <div class="social-section">
      <div class="divider-line">
        <span class="divider-text">أو تسجيل الدخول بـ / or sign in with</span>
      </div>
      <div class="social-buttons">
        <button type="button" class="btn-social btn-google"
                (click)="loginWithGoogle()"
                [disabled]="loading() || googleLoading() || facebookLoading()">
          @if (googleLoading()) {
            <i class="fas fa-spinner fa-spin"></i>
          } @else {
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
          }
          <span>Google</span>
        </button>

        <button type="button" class="btn-social btn-facebook"
                (click)="loginWithFacebook()"
                [disabled]="loading() || googleLoading() || facebookLoading()">
          @if (facebookLoading()) {
            <i class="fas fa-spinner fa-spin"></i>
          } @else {
            <i class="fab fa-facebook-f"></i>
          }
          <span>Facebook</span>
        </button>
      </div>
    </div>

    <!-- Register Link -->
    <div class="register-row">
      <span>ليس لديك حساب؟</span>
      <a routerLink="/register" class="register-link">إنشاء حساب جديد</a>
    </div>

  </div>

  <!-- Fixed Quick Links Bar -->
  <nav class="quick-links" dir="rtl">
    <a href="#" class="quick-link">
      <i class="fas fa-headset"></i>
      <span>الدعم</span>
    </a>
    <a href="#" class="quick-link">
      <i class="fas fa-info-circle"></i>
      <span>حول التطبيق</span>
    </a>
    <a routerLink="/privacy-policy" class="quick-link">
      <i class="fas fa-shield-alt"></i>
      <span>الخصوصية</span>
    </a>
    <a routerLink="/data-deletion" class="quick-link">
      <i class="fas fa-trash-alt"></i>
      <span>حذف البيانات</span>
    </a>
  </nav>

</div>
