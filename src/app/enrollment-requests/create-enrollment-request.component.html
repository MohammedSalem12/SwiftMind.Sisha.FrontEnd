<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>Create Enrollment Request</h3>
    </div>
    <div class="card-body">
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }
      
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="course" class="form-label">Course</label>
          <select 
            id="course" 
            class="form-select" 
            [(ngModel)]="model().courseId"
            (ngModelChange)="model.update(m => ({ ...m, courseId: \ }))"
            name="courseId"
            required>
            <option value="">Select a course</option>
            @for (course of courses(); track course.id) {
              <option [value]="course.id">{{ course.name }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label for="teacher" class="form-label">Teacher</label>
          <input
            type="text"
            id="teacher"
            class="form-control"
            [(ngModel)]="teacherQuery"
            (ngModelChange)="onTeacherQueryChange(\)"
            name="teacherQuery"
            placeholder="Search for teacher..."
            autocomplete="off"
          />
          @if (teacherResults().length > 0) {
            <ul class="list-group mt-1 position-absolute" style="z-index: 1000; max-height: 200px; overflow-y: auto;">
              @for (teacher of teacherResults(); track teacher.id) {
                <li 
                  class="list-group-item list-group-item-action" 
                  (click)="selectTeacher(teacher)"
                  style="cursor: pointer;">
                  {{ teacher.firstName }} {{ teacher.lastName }}
                </li>
              }
            </ul>
          }
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="saving() || !model().courseId || !model().teacherId">
            @if (saving()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Submit Request
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
